services:
  luna:
    image: luna-portfolio:local
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to https://term.pmck.ie}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:?Set ADMIN_SETUP_TOKEN}
      GITHUB_REPOSITORY_URL: ${GITHUB_REPOSITORY_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PORT: 3000
      DATABASE_PATH: /app/data/luna.sqlite
      MEDIA_PATH: /app/uploads
    volumes:
      - database:/app/data
      - media:/app/uploads
    networks:
      - caddy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
          caddy: ${PUBLIC_DOMAIN}
          caddy.reverse_proxy: "{{upstreams 3000}}"
          caddy_ingress_network: caddy

volumes:
  database:
  media:
networks:
  caddy:
    external: true
